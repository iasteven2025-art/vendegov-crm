name: Maintenance - Clean Imported Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-clean-imported-contracts.yml"
      - "tools/clean-imported-contracts.py"

jobs:
  clean_imported_contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crypto dependency
        run: python -m pip install cryptography

      - name: Clean imported contracts from Firestore snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VENDEGOV_CRM }}
        run: python tools/clean-imported-contracts.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendegov-before-clean-contracts
          path: maintenance-backups/*.json
          if-no-files-found: error
